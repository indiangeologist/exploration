<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exploration Activities Dashboard</title>
<meta name="description" content="Daily, weekly and monthly exploration reporting dashboard: Brownfield drilling, Greenfield sampling, Core Shed / PrepLab and mining.">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script>
  // Apply the saved/OS theme before first paint (avoids a flash of the wrong theme)
  (function(){try{var t=localStorage.getItem('xd-theme');if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<style>
:root{
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --serif: Georgia, "Times New Roman", serif;
  --radius: 12px;
  --bg:#f3f4f6; --surface:#ffffff; --surface-2:#f7f8fa; --chart-surface:#ffffff;
  --border:#e3e6eb; --grid:#eceef1; --track:#e9ecf0;
  --text:#14202e; --text-2:#52514e; --muted:#7b7a75;
  --brand:#1c2b45; --brand-ink:#ffffff; --accent:#0f7f86;
  --good-ink:#0a7d0a; --bad-ink:#c23131; --good:#0ca30c; --critical:#d03b3b; --warning:#fab219;
  --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a; --series-4:#eda100;
  --series-5:#e87ba4; --series-6:#008300; --series-7:#6250d6; --series-8:#e34948; --series-other:#9a9893;
  --ws-Brownfield:#2a78d6; --ws-Greenfield:#1baf7a; --ws-PrepLab:#eda100; --ws-Mining:#e87ba4;
  --row-hover:#f4f7fb; --focus:#2a78d6; --shadow:0 1px 2px rgba(16,24,40,.05);
  color-scheme: light;
}
:root[data-theme="dark"]{
  --bg:#111111; --surface:#1a1a19; --surface-2:#222221; --chart-surface:#1a1a19;
  --border:#2f2f2d; --grid:#2a2a28; --track:#2c2c2a;
  --text:#f0efec; --text-2:#c3c2b7; --muted:#8f8d86;
  --brand:#0f1a2b; --brand-ink:#f0efec; --accent:#35b3b9;
  --good-ink:#3cc23c; --bad-ink:#ef7777; --good:#0ca30c; --critical:#e66767;
  --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --series-4:#c98500;
  --series-5:#d55181; --series-6:#0ca30c; --series-7:#9085e9; --series-8:#e66767; --series-other:#6f6d68;
  --ws-Brownfield:#3987e5; --ws-Greenfield:#199e70; --ws-PrepLab:#c98500; --ws-Mining:#d55181;
  --row-hover:#232322; --focus:#3987e5; --shadow:none;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font:14px/1.45 var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.num,.kpi-value,td.n{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* ---------- top bar & navigation ---------- */
.topbar{background:var(--brand);color:var(--brand-ink);padding:14px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-mark{font-family:var(--serif);font-weight:700;font-size:15px;letter-spacing:.06em;border:1.5px solid currentColor;border-radius:999px;padding:3px 12px;opacity:.95}
.brand h1{font-family:var(--serif);font-size:20px;letter-spacing:.04em;margin:0;font-weight:700;text-transform:uppercase}
.brand p{margin:0;font-size:12px;opacity:.75}
.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font-size:12px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.12)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad-ink);border-color:color-mix(in srgb,var(--bad-ink) 40%,var(--border))}
.btn.ghost{background:transparent;border-color:rgba(255,255,255,.28);color:var(--brand-ink)}
.btn.ghost:hover{background:rgba(255,255,255,.1)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.tabs{display:flex;gap:4px;padding:0 24px;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto}
.tab{border:0;background:transparent;padding:13px 16px;font-weight:600;color:var(--text-2);cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
.tab:hover{color:var(--text)}

/* ---------- filter bar ---------- */
.filterbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:10px 24px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:3px}
.field>span{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
select,input[type=date],input[type=text],input[type=number],input[type=search]{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 9px;min-height:34px}
input[type=number]{width:100%}
.period-nav{display:flex;gap:4px}
.period-nav select{min-width:220px}

/* ---------- layout ---------- */
main{padding:20px 24px 48px;max-width:1600px;margin:0 auto}
.view-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:4px 0 16px}
.view-head h2{font-family:var(--serif);font-size:24px;margin:0;letter-spacing:.02em;text-transform:uppercase}
.view-head .sub{color:var(--text-2)}
.grid{display:grid;gap:16px}
.g-3{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(178px,1fr))}
.mt{margin-top:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0;font-size:15px;font-weight:650}
.card .card-sub{color:var(--muted);font-size:12px;margin-top:2px}
.card-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.card-head .grow{flex:1;min-width:0}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:color-mix(in srgb,var(--accent) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 35%,var(--border));border-radius:var(--radius);padding:10px 14px;margin-bottom:16px;font-size:13px}
.banner .grow{flex:1;min-width:240px}
.banner.warn{background:color-mix(in srgb,var(--warning) 14%,var(--surface));border-color:color-mix(in srgb,var(--warning) 45%,var(--border))}

/* headline cards (mirror the report header boxes) */
.headline{border-top:4px solid var(--c,var(--accent))}
.headline .eyebrow{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-2)}
.dot{width:10px;height:10px;border-radius:3px;background:var(--c,var(--accent));flex:none;display:inline-block}
.headline .big{font-family:var(--serif);font-size:21px;font-weight:700;margin:8px 0 4px;line-height:1.2}
.headline .today{color:var(--text-2);font-size:13px;border-top:1px solid var(--border);padding-top:8px;margin-top:10px}

/* KPI cards */
.kpi{display:flex;flex-direction:column;gap:4px}
.kpi-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi-value{font-size:26px;font-weight:700;line-height:1.15}
.kpi-value small{font-size:14px;font-weight:600;color:var(--text-2);margin-left:3px}
.kpi-sub{font-size:12px;color:var(--text-2)}
.delta{display:inline-flex;flex-wrap:wrap;align-items:center;gap:2px 4px;font-size:12px;font-weight:600;margin-top:2px}
.delta.good{color:var(--good-ink)} .delta.bad{color:var(--bad-ink)} .delta.flat{color:var(--muted)}
.delta .vs{font-weight:400;color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);white-space:nowrap}
.status{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;display:inline-flex;gap:4px;align-items:center}
.status.ok{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good-ink)}
.status.no{background:color-mix(in srgb,var(--critical) 16%,transparent);color:var(--bad-ink)}

/* progress bars */
.prog{display:grid;grid-template-columns:minmax(120px,190px) 1fr auto;gap:6px 12px;align-items:center}
.prog .name{font-size:13px;font-weight:600;line-height:1.25}
.prog .name small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.bar{height:10px;background:var(--track);border-radius:999px;overflow:hidden;position:relative}
.bar>i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--fill,var(--series-1))}
.bar.thin{height:7px}
.prog .val{font-size:12px;color:var(--text-2);text-align:right;white-space:nowrap}
.prog .val b{color:var(--text)}
.prog-sep{grid-column:1/-1;border-top:1px solid var(--border);margin:4px 0}

/* charts */
.chart-box{position:relative;height:290px}
.chart-box.tall{height:340px}
.chart-box.short{height:230px}
.empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);text-align:center;font-size:13px;border:1px dashed var(--border);border-radius:10px;padding:16px}
.legend-note{font-size:11px;color:var(--muted);margin-top:8px}

/* challenges */
.issues{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.issue{border:1px solid var(--border);border-left:4px solid var(--c);border-radius:10px;padding:10px 12px;background:var(--surface-2)}
.issue .site{font-weight:650;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.issue .site .date{font-weight:400;color:var(--muted);font-size:12px;margin-left:auto}
.issue p{margin:6px 0 0;font-size:13px}
.issue .lbl{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:4px}

/* tables */
.tbl-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.tbl-tools input[type=search]{min-width:240px;flex:0 1 320px}
.tbl-tools .grow{flex:1}
.tbl-wrap{overflow:auto;border:1px solid var(--border);border-radius:10px;max-height:640px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
th{position:sticky;top:0;background:var(--surface-2);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-2);font-weight:700;white-space:nowrap;z-index:1}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--text)}
th .arr{opacity:.55;font-size:10px;margin-left:3px}
td.n,th.n{text-align:right;white-space:nowrap}
tbody tr:hover td{background:var(--row-hover)}
td.clamp{max-width:340px}
td.clamp div{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
td.wrap{min-width:220px;max-width:380px}
.src{font-size:11px;color:var(--muted);white-space:nowrap}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px;font-size:12px;color:var(--text-2)}
.icon-btn{border:0;background:transparent;cursor:pointer;color:var(--muted);padding:2px 6px;border-radius:6px;font-size:15px;line-height:1}
.icon-btn:hover{color:var(--bad-ink);background:color-mix(in srgb,var(--critical) 12%,transparent)}
tr.sum td{font-weight:700;background:var(--surface-2)}

/* data tab */
.drop{border:2px dashed color-mix(in srgb,var(--accent) 55%,var(--border));border-radius:14px;padding:28px;text-align:center;background:color-mix(in srgb,var(--accent) 5%,var(--surface));cursor:pointer;transition:background .15s}
.drop.over{background:color-mix(in srgb,var(--accent) 16%,var(--surface))}
.drop strong{font-size:16px}
.drop p{margin:6px 0 0;color:var(--text-2)}
.check{display:inline-flex;gap:8px;align-items:center;cursor:pointer}
.msg{font-size:13px;padding:2px 0}
.msg.err{color:var(--bad-ink)} .msg.warn{color:#a86b00} :root[data-theme="dark"] .msg.warn{color:#f0b84a}
.msg.ok{color:var(--good-ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:2px 8px;border-radius:6px;border:1px solid var(--border);background:var(--surface-2)}
.chip.ok{border-color:color-mix(in srgb,var(--good) 45%,var(--border))}
.chip.miss{border-color:color-mix(in srgb,var(--warning) 60%,var(--border))}
.chip.bad{border-color:color-mix(in srgb,var(--critical) 60%,var(--border));color:var(--bad-ink)}
.sites-tbl input,.sites-tbl select{min-height:30px;padding:4px 6px;font-size:12.5px}
.sites-tbl input[type=number]{min-width:84px}
.sites-tbl input[type=text]{min-width:120px}
.sites-tbl th.grp{text-align:center;background:var(--surface)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600}
details summary{cursor:pointer;font-weight:600}

/* modal / toast */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal-bg.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;max-width:460px;width:100%;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal h4{margin:0 0 8px;font-size:17px}
.modal p{margin:0 0 16px;color:var(--text-2)}
.modal .row{display:flex;gap:8px;justify-content:flex-end}
.toast{position:fixed;bottom:20px;right:20px;background:var(--text);color:var(--surface);padding:10px 16px;border-radius:10px;font-weight:500;opacity:0;transform:translateY(10px);transition:all .2s;z-index:120;max-width:420px;pointer-events:none}
.toast.show{opacity:1;transform:none}
.print-only{display:none}
.hidden{display:none!important}

@media (max-width:720px){
  .topbar,.tabs,.filterbar,main{padding-left:14px;padding-right:14px}
  .g-2{grid-template-columns:1fr}
  .prog{grid-template-columns:minmax(0,1fr)}
  .prog .val{text-align:left;white-space:normal;margin-bottom:6px}
  .btn{white-space:normal;text-align:left}
  .tbl-tools input[type=search]{min-width:0;flex:1 1 100%}
  .headline .big{font-size:19px}
  .period-nav select{min-width:160px}
}

/* ---------- print / PDF ---------- */
@media print{
  @page{size:A4 landscape;margin:10mm}
  :root,:root[data-theme="dark"]{--bg:#fff;--surface:#fff;--surface-2:#f6f7f9;--text:#111;--text-2:#444;--muted:#666;--border:#d9dce1;--brand:#1c2b45;--brand-ink:#fff}
  body{background:#fff;font-size:11px}
  .tabs,.filterbar,.top-actions,.no-print,.tbl-tools,.pager,.banner,.col-sel,.col-del{display:none!important}
  .print-only{display:block}
  main{padding:8px 0;max-width:none}
  .card{box-shadow:none;break-inside:avoid;page-break-inside:avoid}
  .tbl-wrap{max-height:none;overflow:visible}
  th{position:static}
  .chart-box{height:230px}
  .topbar{-webkit-print-color-adjust:exact;print-color-adjust:exact;padding:8px 12px}
  .bar,.bar>i,.dot,.headline,.issue,.status{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">CHEMAF</span>
    <div>
      <h1>Exploration Activities</h1>
      <p>Brownfield drilling · Greenfield sampling · Core Shed / PrepLab · Mining</p>
    </div>
  </div>
  <div class="top-actions">
    <span class="pill" id="store-pill" title="Where your data is saved">Loading…</span>
    <button class="btn ghost" id="btn-theme" type="button" aria-label="Toggle light or dark mode">◐ <span>Dark</span></button>
    <button class="btn ghost" id="btn-print" type="button">⎙ Print / PDF</button>
  </div>
</header>

<nav class="tabs" role="tablist" aria-label="Report views">
  <button class="tab" role="tab" data-view="daily" aria-selected="true">Daily</button>
  <button class="tab" role="tab" data-view="weekly" aria-selected="false">Weekly</button>
  <button class="tab" role="tab" data-view="monthly" aria-selected="false">Monthly</button>
  <button class="tab" role="tab" data-view="data" aria-selected="false">Data Upload &amp; Management</button>
</nav>

<section class="filterbar" id="filterbar" aria-label="Filters">
  <label class="field"><span id="f-period-label">Day</span>
    <div class="period-nav">
      <button class="btn sm" type="button" data-action="period-step" data-step="-1" aria-label="Previous period">‹</button>
      <select id="f-period"></select>
      <button class="btn sm" type="button" data-action="period-step" data-step="1" aria-label="Next period">›</button>
    </div>
  </label>
  <label class="field"><span>Workstream</span><select id="f-ws"></select></label>
  <label class="field"><span>Site</span><select id="f-site"></select></label>
  <label class="field"><span>Date range from</span><input type="date" id="f-from"></label>
  <label class="field"><span>to</span><input type="date" id="f-to"></label>
  <label class="field"><span>Trend metric</span><select id="f-metric"></select></label>
  <button class="btn sm" type="button" data-action="reset-filters" style="margin-bottom:4px">Reset filters</button>
</section>

<main id="main">
  <div id="lib-warning"></div>
  <div id="sync-banner"></div>
  <div id="sample-banner"></div>
  <section id="view-daily" class="view" role="tabpanel"></section>
  <section id="view-weekly" class="view hidden" role="tabpanel"></section>
  <section id="view-monthly" class="view hidden" role="tabpanel"></section>
  <section id="view-data" class="view hidden" role="tabpanel"></section>
</main>

<div class="modal-bg" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal">
    <h4 id="modal-title"></h4>
    <p id="modal-body"></p>
    <div class="row">
      <button class="btn" type="button" id="modal-cancel">Cancel</button>
      <button class="btn primary" type="button" id="modal-ok">Confirm</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file-input" accept=".csv,.xlsx,.xls" multiple hidden>
<input type="file" id="backup-input" accept=".json,application/json" hidden>

<script>
'use strict';
/* =====================================================================
   Exploration Activities Dashboard — single-file app
   Data model: one record per Date × Site (× Hole/Block), metrics as columns.
   Weekly and monthly views are computed from the daily records at render
   time, so they can never drift out of sync with the uploaded data.

/* ---------- storage: IndexedDB with localStorage fallback ---------- */
const Store = {
  idb: null,
  open() {
    return new Promise(res => {
      try {
        const rq = indexedDB.open('exploration-dashboard', 1);
        rq.onupgradeneeded = () => rq.result.createObjectStore('kv');
        rq.onsuccess = () => res(rq.result);
        rq.onerror = () => res(null);
        rq.onblocked = () => res(null);
      } catch (e) { res(null); }
    });
  },
  async load() {
    if ('indexedDB' in window) this.idb = await this.open();
    if (this.idb) {
      const v = await new Promise(res => {
        try {
          const g = this.idb.transaction('kv').objectStore('kv').get(STORE_KEY);
          g.onsuccess = () => res(g.result); g.onerror = () => res(undefined);
        } catch (e) { res(undefined); }
      });
      if (v) return v;
    }
    try { const s = localStorage.getItem(STORE_KEY); if (s) return JSON.parse(s); } catch (e) {}
    return null;
  },
  async save(data) {
    if (this.idb) {
      const ok = await new Promise(res => {
        try {
          const tx = this.idb.transaction('kv', 'readwrite');
          tx.objectStore('kv').put(data, STORE_KEY);
          tx.oncomplete = () => res(true); tx.onerror = () => res(false); tx.onabort = () => res(false);
        } catch (e) { res(false); }
      });
      if (ok) return true;
    }
    try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); return true; } catch (e) { return false; }
  },
  engine() { return this.idb ? 'IndexedDB' : 'localStorage'; }
};
async function persist(changed = true) {
  if (changed) { DB.updatedAt = new Date().toISOString(); Sync.meta.dirty = true; Sync.saveMeta(); }
  const ok = await Store.save(DB);
  if (!ok) toast('⚠ Could not save to browser storage. Export a backup now.');
  updateStorePill();
  if (changed) Sync.schedule();
  return ok;
}

/* =====================================================================
   ONLINE SHARING VIA GITHUB
   The shared copy of the data is a file (data.json) in the same GitHub
   repository as this page. Every visitor loads it when the page opens.
   Uploaders publish changes with a GitHub token that stays in their own
   browser only (never in this file or in the repository).
   ===================================================================== */
const b64enc = str => { const bytes = new TextEncoder().encode(str); let bin = ''; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(bin); };

const versionOf = d => (d && (d.updatedAt || d.exportedAt)) || '';
function validData(d) {
  return !!(d && Array.isArray(d.records) && Array.isArray(d.sites) &&
    d.records.every(r => r && typeof r.date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(r.date) && r.site));
}
function normalizeDB(d) {
  return {
    sites: d.sites,
    records: d.records.map(r => ({...r, id: r.id || uid(), workstream: r.workstream || (d.sites.find(x => x.site === r.site) || {}).workstream || 'Brownfield'})),
    settings: {weekStart: 6, sampleBannerDismissed: false, ...(d.settings || {})},
    log: Array.isArray(d.log) ? d.log : [], isSample: !!d.isSample, updatedAt: versionOf(d)
  };
}
const Sync = {
  cfg: {owner: '', repo: '', branch: 'main', path: 'data.json', token: '', auto: true},

  load() {

    try { Object.assign(this.meta, JSON.parse(localStorage.getItem('xd-sync-meta') || '{}')); } catch (e) {}
    // On GitHub Pages the owner and repository can be read from the address
    const h = location.hostname.toLowerCase();
    if (h.endsWith('.github.io')) {
      const seg = location.pathname.split('/').filter(Boolean)[0];
      if (!this.cfg.owner) this.cfg.owner = h.split('.')[0];

  saveMeta() { try { localStorage.setItem('xd-sync-meta', JSON.stringify(this.meta)); } catch (e) {} },
  canPublish() { return !!(this.cfg.owner.trim() && this.cfg.repo.trim() && this.cfg.token.trim()); },
  payload() {

  },
  // Read the shared file as published on the website (no token needed)
  async fetchShared() {
    if (!this.hosted) return null;
    try {

      const r = await fetch(name + '?v=' + Date.now(), {cache: 'no-store'});
      if (!r.ok) return null;

  },
  headers(extra = {}) { return {Authorization: 'Bearer ' + this.cfg.token.trim(), Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', ...extra}; },
  repoUrl(p = '') { return `https://api.github.com/repos/${encodeURIComponent(this.cfg.owner.trim())}/${encodeURIComponent(this.cfg.repo.trim())}${p}`; },
  fileUrl() { return this.repoUrl('/contents/' + this.cfg.path.trim().replace(/^\/+/, '').split('/').map(encodeURIComponent).join('/')); },
  async err(r) {

      403: `The token is not allowed to change ${who}. It needs Contents: Read and write on this repository.`,
      404: `Repository ${who} (branch "${this.cfg.branch}") was not found, or the token was not given access to it.`,

const $ = (s, el = document) => el.querySelector(s);

function fmt(v, dec) {

}
const fmtPct = (v, d = 1) => isNum(v) ? (d === 0 ? NF0 : NF1).format(v) + '%' : '—';
const fmtAxis = v => Math.abs(v) >= 10000 ? NF0.format(v / 1000) + 'K' : NF0.format(v);

// Dates are handled as 'YYYY-MM-DD' strings with UTC arithmetic (no timezone drift)
const toUTC = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); };

const addDays = (s, n) => fromUTC(toUTC(s) + n * 864e5);

const daysBetween = (a, b) => Math.round((toUTC(b) - toUTC(a)) / 864e5);

/* ---------- lookups ---------- */
const siteCfg = name => DB.sites.find(s => s.site === name);

const inRange = (r, a, b) => r.date >= a && r.date <= b;

const allDates = () => [...new Set(DB.records.map(r => r.date))].sort();

/* ---------- periods ---------- */
const VIEW_TYPE = {daily: 'day', weekly: 'week', monthly: 'month'};

  if (type === 'week') { const [a, b] = periodBounds(type, key); return fmtRange(a, b); }

  else if (prev === 0) { dir = cur > 0 ? 1 : 0; txt = cur > 0 ? `+${fmt(cur, dec)} (new)` : 'no change'; }

  if (UI.site !== 'All' && !sites.some(s => s.site === UI.site)) UI.site = 'All';
  $('#f-site').innerHTML = `<option value="All">All sites</option>` + sites.map(s => `<option value="${esc(s.site)}">${esc(s.site)}</option>`).join('');
  $('#f-site').value = UI.site;
  // date range bounds
  const f = firstDate(), l = lastDate();
  ['#f-from', '#f-to'].forEach(id => { $(id).min = f; $(id).max = l; });
  $('#f-from').value = UI.from || ''; $('#f-to').value = UI.to || '';
  // metric
  $('#f-metric').innerHTML = Object.entries(METRICS).map(([k, m]) => `<option value="${k}">${esc(m.label)}</option>`).join('');
  $('#f-metric').value = UI.metric;
  // period
  $('#f-period-label').textContent = {day: 'Report day', week: `Week (${['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][DB.settings.weekStart]}–${['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][(DB.settings.weekStart + 6) % 7]})`, month: 'Month'}[type];
  const list = periodsAvailable(type);
  let cur = UI.period[UI.view];
  if (!cur || !list.includes(cur)) cur = list[list.length - 1] || null;
  UI.period[UI.view] = cur;
  $('#f-period').innerHTML = list.length ? list.slice().reverse().map(k => `<option value="${k}">${esc(periodLabel(type, k))}</option>`).join('') : `<option value="">No data</option>`;
  if (cur) $('#f-period').value = cur;
}

        : `<div class="card"><div class="card-head"><div class="grow"><h3>Sampling progress against programme targets</h3><div class="card-sub">Cumulative % of soil and termite-mound targets as at ${esc(fmtD(w.b))}</div></div></div><div class="chart-box" id="c-sampprog" data-label="Sampling progress against targets"></div></div>`}
      <div class="card"><div class="card-head"><div class="grow"><h3>${esc(METRICS[UI.metric].label)} — trend</h3><div class="card-sub">By ${type === 'day' ? 'day' : type} across the selected date range · change the metric in the filter bar</div></div></div><div class="chart-box" id="c-trend" data-label="Trend"></div></div>

const stackLabel = m => (METRICS[m].ws ? 'site' : 'workstream');

/* ---------- headline boxes (mirror the report header) ---------- */
function renderHeadlines(w, cur, S, type) {
  const span = type === 'day' ? 'Today' : type === 'week' ? 'This week' : 'This month';
  const box = [];
  const drill = S.filter(s => s.workstream === 'Brownfield' && s.drillType && (s.active || hasAny(cur.filter(r => r.site === s.site), ['metres'])));
  if (drill.length) {
    const part = t => { const ss = drill.filter(s => s.drillType === t); if (!ss.length) return null;
      const c = ss.reduce((a, s) => a + cumulative(s.site, 'metres', w.b), 0), p = ss.reduce((a, s) => a + (+s.programmeM || 0), 0);
      const d = sum(cur.filter(r => ss.some(s => s.site === r.site)), ['metres']);
      return {t, c, p, d}; };
    const parts = ['DD', 'RC'].map(part).filter(Boolean);
    box.push(`<div class="card headline" style="--c:${wsColor('Brownfield')}"><div class="eyebrow"><span class="dot"></span>Brownfield drilling</div>
      <div class="big">${parts.map(x => `${x.t} ${fmt(x.c)} / ${fmt(x.p)} m`).join(' &nbsp;|&nbsp; ')}</div>
      ${parts.map(x => `<div class="bar thin" style="margin-top:6px" title="${x.t} ${fmtPct(x.p ? x.c / x.p * 100 : null, 2)}"><i style="width:${Math.min(100, x.p ? x.c / x.p * 100 : 0)}%"></i></div>`).join('')}
      <div class="today">${span} &nbsp;|&nbsp; ${parts.map(x => `${x.t} ${fmt(x.d)} m`).join(' and ')}</div></div>`);
  }
  const geo = S.filter(s => s.workstream === 'Greenfield' && (+s.soilTarget || +s.termiteTarget));
  if (geo.length) {
    const tot = upto => geo.reduce((a, s) => a + cumulative(s.site, 'soil', upto) + cumulative(s.site, 'termite', upto), 0);
    const tgt = geo.reduce((a, s) => a + (+s.soilTarget || 0) + (+s.termiteTarget || 0), 0);
    const c = tot(w.b), cs = cur.filter(r => geo.some(s => s.site === r.site));
    const so = sum(cs, ['soil']), te = sum(cs, ['termite']);
    box.push(`<div class="card headline" style="--c:${wsColor('Greenfield')}"><div class="eyebrow"><span class="dot"></span>Greenfield sampling</div>
      <div class="big">${fmt(c)} / ${fmt(tgt)} samples</div>
      <div class="bar thin" style="margin-top:6px"><i style="width:${Math.min(100, tgt ? c / tgt * 100 : 0)}%;--fill:var(--series-3)"></i></div>
      <div class="kpi-sub" style="margin-top:4px">${fmtPct(tgt ? c / tgt * 100 : null)} of the sampling programme completed</div>
      <div class="today">${span} &nbsp;|&nbsp; ${fmt(so + te)} samples (${fmt(so)} soil and ${fmt(te)} termite)</div></div>`);
  }
  const prep = S.filter(s => s.workstream === 'PrepLab');
  if (prep.length) {
    const p = pendingAt(w.b, prep.map(s => s.site));
    const pc = cur.filter(r => r.workstream === 'PrepLab');
    const sub = sum(pc, ['submitted']), rec = sum(pc, ['received']);
    const cr = prep.reduce((a, s) => a + cumulative(s.site, 'received', w.b), 0), cs = prep.reduce((a, s) => a + cumulative(s.site, 'submitted', w.b), 0);
    box.push(`<div class="card headline" style="--c:${wsColor('PrepLab')}"><div class="eyebrow"><span class="dot"></span>Core Shed / PrepLab</div>
      <div class="big">${isNum(p.value) ? fmt(p.value) + ' samples pending preparation' : 'Backlog not reported'}</div>
      <div class="kpi-sub">${isNum(p.value) ? 'Snapshot ' + fmtD(p.date) + ' · ' : ''}Cumulative ${fmt(cr)} received / ${fmt(cs)} submitted</div>
      <div class="today">${span} &nbsp;|&nbsp; ${fmt(sub)} submitted incl. QA/QC${hasAny(pc, ['received']) ? `, ${fmt(rec)} received` : ' · intake not reported'}</div></div>`);
  }
  const mine = S.filter(s => s.workstream === 'Mining');
  if (mine.length && (UI.ws === 'Mining' || box.length < 3)) {
    const mc = cur.filter(r => r.workstream === 'Mining');
    const ct = mine.reduce((a, s) => a + cumulative(s.site, 'trips', w.b), 0);
    const cton = mine.reduce((a, s) => a + ['waste', 'cu', 'co'].reduce((b, k) => b + cumulative(s.site, k, w.b), 0), 0);
    box.push(`<div class="card headline" style="--c:${wsColor('Mining')}"><div class="eyebrow"><span class="dot"></span>Mining operations</div>
      <div class="big">${fmt(ct)} trips · ${fmt(cton)} t</div><div class="kpi-sub">Cumulative estimated tonnage</div>
      <div class="today">${span} &nbsp;|&nbsp; ${fmt(sum(mc, ['trips']))} trips, ${fmt(sum(mc, ['waste', 'cu', 'co']))} t</div></div>`);
  }
  $('#hl').innerHTML = box.join('') || '';
  $('#hl').classList.toggle('hidden', !box.length);
}

/* ---------- KPI cards with period-over-period variance ---------- */
function renderKPIs(w, cur, prev, S, vs) {
  const show = ws => UI.ws === 'All' ? true : UI.ws === ws;
  const ddSites = new Set(DB.sites.filter(s => s.drillType === 'DD').map(s => s.site));
  const rcSites = new Set(DB.sites.filter(s => s.drillType !== 'DD').map(s => s.site));
  const k = [];
  const nr = (recs, keys, v) => hasAny(recs, keys) ? v : '—';
  const card = (label, value, unit, sub, delta, ws, extra = '') => `<div class="card kpi"><div class="kpi-label">${ws ? `<span class="dot" style="--c:${wsColor(ws)}"></span>` : ''}${label}</div>
    <div class="kpi-value">${value}${unit ? `<small>${unit}</small>` : ''}</div><div class="kpi-sub">${sub}</div>${delta}${extra}</div>`;
  if (show('Brownfield')) {
    const m = sum(cur, ['metres']), pm = sum(prev, ['metres']);
    const dd = sum(cur.filter(r => ddSites.has(r.site)), ['metres']), rc = sum(cur.filter(r => rcSites.has(r.site)), ['metres']);
    k.push(card('Metres drilled', nr(cur, ['metres'], fmt(m)), hasAny(cur, ['metres']) ? 'm' : '', `DD ${fmt(dd)} m · RC ${fmt(rc)} m`, deltaHTML(hasAny(cur, ['metres']) ? m : null, hasAny(prev, ['metres']) ? pm : null, {vs}), 'Brownfield'));
    const recov = rs => { const x = rs.filter(r => ddSites.has(r.site) && isNum(r.recovered) && isNum(r.metres) && r.metres > 0); const mm = sum(x, ['metres']); return mm ? sum(x, ['recovered']) / mm * 100 : null; };
    const rv = recov(cur), pv = recov(prev);
    const tgt = Math.max(0, ...DB.sites.filter(s => s.drillType === 'DD').map(s => +s.recoveryTarget || 0)) || 90;
    const st = isNum(rv) ? (rv >= tgt ? `<span class="status ok">✓ On target</span>` : `<span class="status no">✕ Below ${tgt}%</span>`) : '';
    k.push(card('Core recovery (DD)', fmtPct(rv), '', `Target ≥${tgt}% ${st}`, deltaHTML(rv, pv, {pp: true, vs}), 'Brownfield'));
  }
  if (show('Greenfield')) {
    const so = sum(cur, ['soil']), te = sum(cur, ['termite']);
    k.push(card('Samples collected', nr(cur, ['soil', 'termite'], fmt(so + te)), '', `${fmt(so)} soil · ${fmt(te)} termite`, deltaHTML(hasAny(cur, ['soil', 'termite']) ? so + te : null, hasAny(prev, ['soil', 'termite']) ? sum(prev, ['soil', 'termite']) : null, {vs}), 'Greenfield'));
  }
  if (show('PrepLab')) {
    const sb = sum(cur, ['submitted']), rc = sum(cur, ['received']);
    const prepSites = S.filter(s => s.workstream === 'PrepLab');
    const tgt = prepSites.reduce((a, s) => a + (+s.dailySubmitTarget || 0), 0) * w.days;
    k.push(card('Samples submitted', nr(cur, ['submitted'], fmt(sb)), '', `${hasAny(cur, ['received']) ? fmt(rc) + ' received' : 'Receipts not reported'}${tgt ? ` · ${fmtPct(sb / tgt * 100, 0)} of ${fmt(tgt)} target` : ''}`,
      deltaHTML(hasAny(cur, ['submitted']) ? sb : null, hasAny(prev, ['submitted']) ? sum(prev, ['submitted']) : null, {vs}), 'PrepLab'));
    const names = prepSites.map(s => s.site);
    const p = pendingAt(w.b, names), pp = pendingAt(w.pb, names);
    k.push(card('Pending preparation', isNum(p.value) ? fmt(p.value) : '—', '', isNum(p.value) ? `Backlog snapshot ${fmtDs(p.date)}` : 'No backlog snapshot reported',
      deltaHTML(p.value, pp.date && pp.date !== p.date ? pp.value : null, {goodUp: false, vs: pp.date && pp.date !== p.date ? 'vs ' + fmtDs(pp.date) : ''}), 'PrepLab'));
  }
  if (show('Mining')) {
    const t = sum(cur, ['trips']), ton = sum(cur, ['waste', 'cu', 'co']);
    k.push(card('Truck trips', nr(cur, ['trips'], fmt(t)), '', hasAny(cur, ['trips']) ? (hasAny(cur, ['waste', 'cu', 'co']) ? `${fmt(ton)} t estimated (${fmt(sum(cur, ['cu', 'co']))} t ore)` : 'Tonnage not reported') : 'Not reported this period', deltaHTML(hasAny(cur, ['trips']) ? t : null, hasAny(prev, ['trips']) ? sum(prev, ['trips']) : null, {vs}), 'Mining'));
  }
  const dt = sum(cur, ['downtime']);
  const nSites = new Set(cur.filter(r => isNum(r.downtime) && r.downtime > 0).map(r => r.site)).size;
  k.push(card('Downtime', nr(cur, ['downtime'], fmt(dt, 1)), hasAny(cur, ['downtime']) ? 'h' : '', nSites ? `${nSites} site${nSites > 1 ? 's' : ''} affected` : 'No downtime hours reported', deltaHTML(hasAny(cur, ['downtime']) ? dt : null, hasAny(prev, ['downtime']) ? sum(prev, ['downtime']) : null, {goodUp: false, vs}), null));
  $('#kpis').innerHTML = k.join('');
}

/* ---------- programme progress (HTML bars) ---------- */
function renderProgress(w, S, cur) {
  const rows = [];
  const bar = (pct, fill) => `<div class="bar"><i style="width:${Math.max(0, Math.min(100, pct || 0))}%;--fill:${fill}"></i></div>`;
  const active = S.filter(s => s.active || cur.some(r => r.site === s.site));
  for (const ws of WS) {
    const ss = active.filter(s => s.workstream === ws); if (!ss.length) continue;
    if (rows.length) rows.push('<div class="prog-sep"></div>');
    for (const s of ss) {
      const name = `<div class="name">${esc(s.site)}<small>${esc([s.licence, s.activity].filter(Boolean).join(' · '))}</small></div>`;
      if (+s.programmeM) {
        const c = cumulative(s.site, 'metres', w.b), p = +s.programmeM;
        rows.push(`${name}${bar(c / p * 100, 'var(--series-1)')}<div class="val"><b>${fmt(c)}</b> / ${fmt(p)} m · <b>${fmtPct(c / p * 100, c / p < 0.1 ? 2 : 1)}</b></div>`);
      } else if (+s.soilTarget || +s.termiteTarget) {
        const cs = cumulative(s.site, 'soil', w.b), ct = cumulative(s.site, 'termite', w.b);
        const ts = +s.soilTarget || 0, tt = +s.termiteTarget || 0;
        rows.push(`${name}<div>${ts ? bar(cs / ts * 100, 'var(--series-1)') : ''}<div style="height:4px"></div>${tt ? bar(ct / tt * 100, 'var(--series-2)') : ''}</div>
          <div class="val">Soil <b>${fmt(cs)}</b>/${fmt(ts)} · <b>${fmtPct(ts ? cs / ts * 100 : null)}</b><br>Termite <b>${fmt(ct)}</b>/${fmt(tt)} · <b>${fmtPct(tt ? ct / tt * 100 : null)}</b></div>`);
      } else if (+s.dailySubmitTarget) {
        const sub = sum(cur.filter(r => r.site === s.site), ['submitted']), t = +s.dailySubmitTarget * w.days;
        rows.push(`${name}${bar(sub / t * 100, 'var(--series-4)')}<div class="val">Submitted <b>${fmt(sub)}</b> / ${fmt(t)} · <b>${fmtPct(sub / t * 100, 0)}</b> of ${fmt(+s.dailySubmitTarget)}/day</div>`);
      } else if (s.workstream === 'Mining') {
        rows.push(`${name}<div class="kpi-sub">No programme target set</div><div class="val"><b>${fmt(cumulative(s.site, 'trips', w.b))}</b> trips cumulative</div>`);
      } else {
        rows.push(`${name}<div class="kpi-sub">No numeric target · see records</div><div class="val"></div>`);
      }
    }
  }
  $('#progress').innerHTML = rows.length
    ? `<div class="prog">${rows.join('')}</div><div class="legend-note">Bars: <span class="dot" style="--c:var(--series-1)"></span> metres / soil &nbsp; <span class="dot" style="--c:var(--series-2)"></span> termite &nbsp; <span class="dot" style="--c:var(--series-4)"></span> submissions vs target. Targets and carried-in balances are editable under Data → Sites &amp; targets.</div>`
    : `<div class="empty" style="height:160px">No active sites for this selection.</div>`;
}

/* ---------- charts ---------- */
function bySite(recs, keys) {
  const m = new Map();
  for (const r of recs) { const v = sum([r], keys); if (!hasAny([r], keys)) continue; m.set(r.site, (m.get(r.site) || 0) + v); }
  return m;
}
function chartMetresBySite(cur) {
  const m = bySite(cur, ['metres']);
  const sites = [...m.keys()].sort((a, b) => m.get(b) - m.get(a));
  const o = chartOpts({horizontal: true, legend: false, unit: 'm', pad: {right: 56}, labels: {enabled: true, format: v => fmt(v) + ' m'}});
  mkChart('c-metres', {type: 'bar', data: {labels: sites, datasets: [barDataset('Metres drilled', sites.map(s => m.get(s)), cssVar('--series-1'))]}, options: o},
    !sites.length, 'No drilling reported for this period.');
}
function chartSamplesBySite(cur) {
  const so = bySite(cur, ['soil']), te = bySite(cur, ['termite']);
  const sites = [...new Set([...so.keys(), ...te.keys()])].filter(s => (so.get(s) || 0) + (te.get(s) || 0) > 0);
  const o = chartOpts({horizontal: true, stacked: true});
  mkChart('c-samples', {type: 'bar', data: {labels: sites, datasets: [
    barDataset('Soil', sites.map(s => so.get(s) || 0), cssVar('--series-1'), {stacked: true, horizontal: true}),
    barDataset('Termite', sites.map(s => te.get(s) || 0), cssVar('--series-2'), {stacked: true, horizontal: true})]}, options: o},
  !sites.length, 'No samples collected in this period.');
}
function chartSamplingProgress(w, S) {
  const geo = S.filter(s => s.workstream === 'Greenfield' && (+s.soilTarget || +s.termiteTarget));
  const pct = (s, k, t) => +s[t] ? Math.round(cumulative(s.site, k, w.b) / +s[t] * 1000) / 10 : null;
  const o = chartOpts({pct: true, labels: {enabled: true, format: v => fmtPct(v)}, pad: {top: 20}});
  const top = Math.max(100, ...geo.flatMap(s => [pct(s, 'soil', 'soilTarget') || 0, pct(s, 'termite', 'termiteTarget') || 0]));
  o.scales.y.max = Math.ceil(top / 10) * 10 + 15;
  o.scales.y.afterBuildTicks = ax => { ax.ticks = ax.ticks.filter(t => t.value <= Math.ceil(top / 10) * 10); };
  o.plugins.legend.labels.padding = 22;
  mkChart('c-sampprog', {type: 'bar', data: {labels: geo.map(s => s.site.replace(/ Geochem$/, '')), datasets: [
    barDataset('Soils', geo.map(s => pct(s, 'soil', 'soilTarget')), cssVar('--series-1')),
    barDataset('Termite mounds', geo.map(s => pct(s, 'termite', 'termiteTarget')), cssVar('--series-2'))]}, options: o},
  !geo.length, 'No Greenfield sites with sampling targets in this selection.');
}
// Trend: bucketed by day / week / month across the selected date range, stacked by site
function trendBuckets(type, w) {
  const R = scopedRecords();
  let from = UI.from || firstDate(), to = UI.to || lastDate();
  if (type === 'day') { if (!UI.from) from = addDays(w.b, -20) < firstDate() ? firstDate() : addDays(w.b, -20); if (!UI.to) to = w.b; }
  const keys = [];
  let k = periodKey(type, from); const end = periodKey(type, to);
  let guard = 0;
  while (k <= end && guard++ < 400) { keys.push(k); k = type === 'day' ? addDays(k, 1) : type === 'week' ? addDays(k, 7) : (() => { const [y, m] = k.split('-').map(Number); return new Date(Date.UTC(y, m, 1)).toISOString().slice(0, 7); })(); }
  return {keys, recs: R.filter(r => r.date >= from && r.date <= to), from, to};
}
function stackedByGroup(recs, keys, bucketOf, buckets) {
  const metric = METRICS[UI.metric];
  const groupBy = metric.ws ? 'site' : 'workstream';
  const rel = recs.filter(r => hasAny([r], metric.keys) && (!metric.ws || UI.ws !== 'All' || r.workstream === metric.ws || true));
  let groups = [...new Set(rel.map(r => r[groupBy]))];
  if (groupBy === 'site') groups.sort((a, b) => DB.sites.findIndex(s => s.site === a) - DB.sites.findIndex(s => s.site === b));
  else groups.sort((a, b) => WS.indexOf(a) - WS.indexOf(b));
  const ds = groups.map(g => {
    const data = buckets.map(() => 0);
    for (const r of rel) if (r[groupBy] === g) { const i = buckets.indexOf(bucketOf(r)); if (i >= 0) data[i] += sum([r], metric.keys); }
    const color = groupBy === 'site' ? siteColor(g) : cssVar('--ws-' + g);
    return barDataset(groupBy === 'site' ? g : WS_LABEL[g], data.map(v => Math.round(v * 100) / 100), color, {stacked: true});
  });
  return ds;
}
function chartTrend(type, w) {
  const {keys, recs} = trendBuckets(type, w);
  const metric = METRICS[UI.metric];
  const ds = stackedByGroup(recs, metric.keys, r => periodKey(type, r.date), keys);
  const labels = keys.map(k => type === 'day' ? fmtDs(k) : type === 'week' ? fmtDs(k) + '–' + fmtDs(addDays(k, 6)) : periodLabel('month', k).replace(/ \d{4}$/, m => m.slice(0, 0) + ' ' + k.slice(2, 4)));
  const o = chartOpts({stacked: true, unit: metric.unit});
  o.plugins.tooltip.callbacks.footer = items => 'Total: ' + fmt(items.reduce((a, i) => a + (+i.raw || 0), 0)) + (metric.unit ? ' ' + metric.unit : '');
  mkChart('c-trend', {type: 'bar', data: {labels, datasets: ds}, options: o}, !ds.length || ds.every(d => d.data.every(v => !v)), `No ${metric.label.toLowerCase()} in the selected date range.`);
}
function chartInPeriod(w) {
  const days = []; for (let d = w.a; d <= w.b; d = addDays(d, 1)) days.push(d);
  const recs = scopedRecords().filter(r => inRange(r, w.a, w.b));
  const metric = METRICS[UI.metric];
  const ds = stackedByGroup(recs, metric.keys, r => r.date, days);
  const o = chartOpts({stacked: true, unit: metric.unit});
  o.plugins.tooltip.callbacks.footer = items => 'Total: ' + fmt(items.reduce((a, i) => a + (+i.raw || 0), 0)) + (metric.unit ? ' ' + metric.unit : '');
  mkChart('c-inperiod', {type: 'bar', data: {labels: days.map(fmtDs), datasets: ds}, options: o}, !ds.length || ds.every(d => d.data.every(v => !v)), `No ${metric.label.toLowerCase()} in this period.`);
}
function chartPrep(type, w) {
  let keys, recs;
  if (type === 'day') {
    const ds = [...new Set(DB.records.filter(r => r.workstream === 'PrepLab' && r.date <= w.b).map(r => r.date))].sort().slice(-14);
    keys = ds; recs = DB.records.filter(r => r.workstream === 'PrepLab' && ds.includes(r.date));
  } else { const t = trendBuckets(type, w); keys = t.keys; recs = t.recs.filter(r => r.workstream === 'PrepLab'); }
  if (UI.site !== 'All') recs = recs.filter(r => r.site === UI.site);
  const agg = k => keys.map(b => { const x = recs.filter(r => periodKey(type, r.date) === b); return hasAny(x, [k]) ? sum(x, [k]) : null; });
  const labels = keys.map(k => type === 'month' ? periodLabel('month', k) : type === 'week' ? fmtDs(k) + '–' + fmtDs(addDays(k, 6)) : fmtDs(k));
  const show = UI.ws === 'All' || UI.ws === 'PrepLab';
  mkChart('c-prep', {type: 'bar', data: {labels, datasets: [
    barDataset('Received', agg('received'), cssVar('--series-1')),
    barDataset('Submitted incl. QA/QC', agg('submitted'), cssVar('--series-2'))]}, options: chartOpts({})},
  !show || !hasAny(recs, ['received', 'submitted']), show ? 'No PrepLab receipts or submissions in this range.' : 'PrepLab is outside the current workstream filter.');
}
function chartDowntime(cur) {
  const m = bySite(cur, ['downtime']);

function chartShare(cur) {

        tooltip: {callbacks: {label: c => ` ${c.label}: ${fmt(c.raw)} samples (${fmtPct(c.raw / total * 100)})`}}}}};

/* ---------- site summary table ---------- */
function siteResult(site, recs) {
  const c = siteCfg(site) || {workstream: ''}; const r = recs.filter(x => x.site === site);
  switch (c.workstream) {
    case 'Brownfield': return {v: sum(r, ['metres']), txt: hasAny(r, ['metres']) ? fmt(sum(r, ['metres'])) + ' m' : '—', has: hasAny(r, ['metres'])};
    case 'Greenfield': { const s = sum(r, ['soil']), t = sum(r, ['termite']); return {v: s + t, txt: hasAny(r, ['soil', 'termite']) ? `${fmt(s)} soil / ${fmt(t)} termite` : '—', has: hasAny(r, ['soil', 'termite'])}; }
    case 'PrepLab': { const a = sum(r, ['received']), b = sum(r, ['submitted']); return {v: b, txt: hasAny(r, ['received', 'submitted']) ? `${hasAny(r, ['received']) ? fmt(a) : 'NR'} rec. / ${fmt(b)} sub.` : '—', has: hasAny(r, ['submitted'])}; }
    case 'Mining': return {v: sum(r, ['trips']), txt: hasAny(r, ['trips']) ? `${fmt(sum(r, ['trips']))} trips` : '—', has: hasAny(r, ['trips'])};
    default: return {v: 0, txt: '—', has: false};
  }
}
function renderSummary(w, cur, prev, S, type) {
  const sites = S.filter(s => s.active || cur.some(r => r.site === s.site) || prev.some(r => r.site === s.site));
  if (!sites.length) { $('#summary').innerHTML = `<div class="empty" style="height:120px">No sites for this selection.</div>`; return; }
  const rows = sites.map(s => {
    const a = siteResult(s.site, cur), b = siteResult(s.site, prev);
    let target = 'NR', cum = 'NR', pct = 'NR';
    if (+s.programmeM) { const c = cumulative(s.site, 'metres', w.b); target = `${fmt(+s.programmeM)} m`; cum = `${fmt(c)} m`; pct = fmtPct(c / s.programmeM * 100, c / s.programmeM < 0.1 ? 2 : 1); }
    else if (+s.soilTarget || +s.termiteTarget) {
      const cs = cumulative(s.site, 'soil', w.b), ct = cumulative(s.site, 'termite', w.b);
      target = `${fmt(+s.soilTarget || 0)} soil / ${fmt(+s.termiteTarget || 0)} termite`; cum = `${fmt(cs)} / ${fmt(ct)}`;
      pct = `${fmtPct(+s.soilTarget ? cs / s.soilTarget * 100 : null)} soil · ${fmtPct(+s.termiteTarget ? ct / s.termiteTarget * 100 : null)} termite`;
    } else if (s.workstream === 'PrepLab') {
      target = +s.dailySubmitTarget ? `${fmt(+s.dailySubmitTarget)} submissions / day` : 'NR';
      cum = `${fmt(cumulative(s.site, 'received', w.b))} rec. / ${fmt(cumulative(s.site, 'submitted', w.b))} sub.`;
      pct = +s.dailySubmitTarget && a.has ? fmtPct(a.v / (s.dailySubmitTarget * w.days) * 100, 0) + ' of target' : 'NR';
    } else if (s.workstream === 'Mining') {
      const ton = ['waste', 'cu', 'co'].reduce((x, k) => x + cumulative(s.site, k, w.b), 0);
      cum = `${fmt(cumulative(s.site, 'trips', w.b))} trips / ${fmt(ton)} t`;
    }
    const d = a.has || b.has ? deltaHTML(a.has ? a.v : 0, b.has ? b.v : null, {vs: ''}) : '<span class="delta flat">—</span>';
    return `<tr><td><b>${esc(s.site)}</b><div class="src">${esc([s.licence, s.activity].filter(Boolean).join(' · '))}</div></td>
      <td><span class="tag"><span class="dot" style="--c:${wsColor(s.workstream)}"></span>${esc(s.workstream)}</span></td>
      <td class="n">${a.txt}</td><td class="n">${b.txt}</td><td class="n">${d}</td><td>${esc(target)}</td><td class="n">${esc(cum)}</td><td>${esc(pct)}</td></tr>`;
  }).join('');
  const lbl = {day: 'Day', week: 'Week', month: 'Month'}[type];
  $('#summary').innerHTML = `<div class="tbl-wrap"><table><thead><tr><th>Site</th><th>Workstream</th><th class="n">${lbl} result</th><th class="n">Prior ${lbl.toLowerCase()}</th><th class="n">Change</th><th>Programme / target</th><th class="n">Cumulative</th><th>Completed</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

/* ---------- challenges ---------- */
function renderIssues(cur) {
  const latest = new Map();
  for (const r of cur.slice().sort((a, b) => a.date.localeCompare(b.date))) {
    if (!r.challenge && !r.action) continue;
    const prev = latest.get(r.site);
    if (prev && prev.date === r.date) { latest.set(r.site, {...r, challenge: [prev.challenge, r.challenge].filter(Boolean).join(' '), action: r.action || prev.action}); }
    else latest.set(r.site, r);
  }
  const items = [...latest.values()].sort((a, b) => WS.indexOf(a.workstream) - WS.indexOf(b.workstream));
  $('#issues').innerHTML = items.length ? `<div class="issues">${items.map(r => `<div class="issue" style="--c:${wsColor(r.workstream)}">
      <div class="site">${esc(r.site)}<span class="tag">${esc(r.workstream)}</span><span class="date">${esc(fmtD(r.date))}</span></div>
      ${r.challenge ? `<p><span class="lbl">Challenge</span>${esc(r.challenge)}</p>` : ''}
      ${r.action ? `<p><span class="lbl">Action</span>${esc(r.action)}</p>` : ''}</div>`).join('')}</div>`
    : `<div class="empty" style="height:90px">No challenges or actions recorded in this period.</div>`;
}

const TABLE_COLS = [
  {k: 'date', l: 'Date', f: r => fmtD(r.date)},
  {k: 'workstream', l: 'Workstream', ws: true, f: r => `<span class="tag"><span class="dot" style="--c:${wsColor(r.workstream)}"></span>${esc(r.workstream)}</span>`},

  {k: 'source', l: 'Source', f: r => `<span class="src">${esc(r.source || '')}</span>`}

function renderTable(id, recs, {showWs = true} = {}) {
  const st = UI.tables[id] || (UI.tables[id] = {q: '', sort: 'date', dir: -1, page: 0, size: 25, sel: new Set()});
  const host = document.getElementById(id); if (!host) return;
  const get = (c, r) => c.get ? c.get(r) : r[c.k];
  const cols = TABLE_COLS.filter(c => (c.k !== 'workstream' || showWs) && (!c.n && !c.clamp || recs.some(r => { const v = get(c, r); return v !== null && v !== undefined && v !== ''; })));
  const q = st.q.trim().toLowerCase();
  let rows = q ? recs.filter(r => Object.values(r).some(v => String(v ?? '').toLowerCase().includes(q))) : recs.slice();
  const sc = TABLE_COLS.find(c => c.k === st.sort) || TABLE_COLS[0];
  rows.sort((a, b) => {
    const va = get(sc, a), vb = get(sc, b);
    if (va == null && vb == null) return 0; if (va == null) return 1; if (vb == null) return -1;
    const c = typeof va === 'number' && typeof vb === 'number' ? va - vb : String(va).localeCompare(String(vb), undefined, {numeric: true});
    return (c || a.site.localeCompare(b.site)) * st.dir;
  });

  const pageRows = rows.slice(st.page * size, st.page * size + size);
  for (const sid of [...st.sel]) if (!recs.some(r => r.id === sid)) st.sel.delete(sid);
  const allSel = pageRows.length && pageRows.every(r => st.sel.has(r.id));
  const totals = cols.filter(c => c.n && c.k !== 'pending').reduce((o, c) => (o[c.k] = rows.reduce((a, r) => a + (isNum(get(c, r)) ? get(c, r) : 0), 0), o), {});
  host.innerHTML = `
    <div class="tbl-tools">
      <input type="search" placeholder="Search records (site, hole, challenge, source…)" value="${esc(st.q)}" data-tbl-search="${id}" aria-label="Search records">
      <span class="grow"></span>
      ${st.sel.size ? `<button class="btn sm danger" data-action="tbl-del-sel" data-tbl="${id}">Delete ${st.sel.size} selected</button>` : ''}
      <label class="check" style="font-size:12px">Rows <select data-tbl-size="${id}">${[10, 25, 50, 100, 500].map(n => `<option ${n === st.size ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
    </div>
    <div class="tbl-wrap"><table><thead><tr>
      <th class="col-sel"><input type="checkbox" aria-label="Select all on page" data-tbl-selall="${id}" ${allSel ? 'checked' : ''}></th>
      ${cols.map(c => `<th class="sortable ${c.n ? 'n' : ''}" data-tbl-sort="${id}" data-k="${c.k}">${c.l}<span class="arr">${st.sort === c.k ? (st.dir > 0 ? '▲' : '▼') : '↕'}</span></th>`).join('')}
      <th class="col-del"></th></tr></thead>
      <tbody>${pageRows.map(r => `<tr>
        <td class="col-sel"><input type="checkbox" data-tbl-sel="${id}" data-id="${esc(r.id)}" ${st.sel.has(r.id) ? 'checked' : ''} aria-label="Select record"></td>
        ${cols.map(c => c.n ? `<td class="n">${isNum(get(c, r)) ? fmt(get(c, r)) : ''}</td>` : c.clamp ? `<td class="clamp" title="${esc(r[c.k] || '')}"><div>${esc(r[c.k] || '')}</div></td>` : `<td>${c.f ? c.f(r) : esc(r[c.k] ?? '')}</td>`).join('')}
        <td class="col-del"><button class="icon-btn" title="Delete this record" aria-label="Delete record" data-action="del-rec" data-id="${esc(r.id)}" data-tbl="${id}">🗑</button></td></tr>`).join('') ||
        `<tr><td colspan="${cols.length + 2}" style="text-align:center;color:var(--muted);padding:24px">No matching records</td></tr>`}
      ${rows.length > 1 ? `<tr class="sum"><td class="col-sel"></td>${cols.map((c, i) => i === 0 ? `<td>Total (${fmt(rows.length)} rows)</td>` : c.n ? `<td class="n">${c.k === 'pending' ? '' : fmt(totals[c.k])}</td>` : '<td></td>').join('')}<td class="col-del"></td></tr>` : ''}
      </tbody></table></div>
    <div class="pager">${rows.length ? `${fmt(st.page * size + 1)}–${fmt(Math.min(rows.length, (st.page + 1) * size))} of ${fmt(rows.length)}` : '0 records'}

  host._recs = recs; host._opts = {showWs};
}
function rerenderTable(id) { const h = document.getElementById(id); if (h && h._recs) renderTable(id, h._recs.filter(r => DB.records.includes(r)), h._opts); }

async function deleteRecords(ids) {
  const set = new Set(ids);
  DB.records = DB.records.filter(r => !set.has(r.id));
  DB.log.unshift({when: new Date().toISOString(), action: 'delete', detail: `${set.size} record(s) deleted`});
  await persist(); render(); toast(`Deleted ${set.size} record${set.size > 1 ? 's' : ''}. Weekly and monthly totals recalculated.`);
}

/* ---------- parsing ---------- */
function parseCSV(text) {
  text = text.replace(/^﻿/, '');
  const firstLine = text.split(/\r?\n/)[0] || '';
  const delim = (firstLine.match(/;/g) || []).length > (firstLine.match(/,/g) || []).length ? ';' : (firstLine.includes('\t') && !firstLine.includes(',') ? '\t' : ',');
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === delim) { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += c;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows;
}
const ALIAS_MAP = (() => { const m = {}; for (const f of FIELDS) for (const a of [f.key, f.label, ...f.aliases]) m[norm(a)] = f.key; return m; })();
function matchHeader(h) { const n = norm(h); if (!n) return null; return ALIAS_MAP[n] || null; }
function parseDate(v) {
  if (v instanceof Date && !isNaN(v)) return `${v.getFullYear()}-${String(v.getMonth() + 1).padStart(2, '0')}-${String(v.getDate()).padStart(2, '0')}`;
  if (typeof v === 'number' && v > 20000 && v < 80000) { // Excel serial date
    if (window.XLSX && XLSX.SSF) { const d = XLSX.SSF.parse_date_code(v); return `${d.y}-${String(d.m).padStart(2, '0')}-${String(d.d).padStart(2, '0')}`; }
    return fromUTC(Math.round((v - 25569) * 864e5));
  }
  const s = String(v).trim(); let m;
  const ok = (y, mo, d) => { y = +y; mo = +mo; d = +d; if (y < 100) y += 2000; if (mo < 1 || mo > 12 || d < 1 || d > 31) return null; const iso = `${y}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}`; return fromUTC(toUTC(iso)) === iso ? iso : null; };
  if ((m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})(?:[ T].*)?$/))) return ok(m[1], m[2], m[3]);
  if ((m = s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})(?:\s.*)?$/))) return ok(m[3], m[2], m[1]); // DD/MM/YYYY
  const mi = t => MON.findIndex(x => x.toLowerCase() === t.slice(0, 3).toLowerCase()) + 1;
  if ((m = s.match(/^(\d{1,2})[\s\-/.]+([A-Za-z]{3,9})\.?[\s\-/.,]+(\d{2,4})$/)) && mi(m[2])) return ok(m[3], mi(m[2]), m[1]);
  if ((m = s.match(/^([A-Za-z]{3,9})\.?\s+(\d{1,2}),?\s+(\d{4})$/)) && mi(m[1])) return ok(m[3], mi(m[1]), m[2]);

}
function parseNum(v) {

  else if (/^-?\d+,\d+$/.test(s)) s = s.replace(',', '.');

}
function normWS(v) { const n = norm(v); if (!n) return null; return WS.find(w => norm(w) === n) || WS_ALIASES[n] || (n.includes('brown') ? 'Brownfield' : n.includes('green') ? 'Greenfield' : n.includes('prep') || n.includes('core') ? 'PrepLab' : n.includes('min') ? 'Mining' : null); }

async function readFileRows(file) {
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  if (ext === 'csv' || ext === 'txt') return [{sheet: 'CSV', rows: parseCSV(await file.text())}];
  if (ext === 'xlsx' || ext === 'xls' || ext === 'xlsm') {
    if (!window.XLSX) throw new Error('Excel parser not loaded (check internet connection). Save the file as CSV and try again.');
    const wb = XLSX.read(await file.arrayBuffer(), {type: 'array', cellDates: false});
    return wb.SheetNames.map(n => ({sheet: n, rows: XLSX.utils.sheet_to_json(wb.Sheets[n], {header: 1, raw: true, defval: null, blankrows: false})}));
  }
  throw new Error(`Unsupported file type ".${ext}". Use .csv or .xlsx.`);
}
async function handleFiles(files) {
  for (const file of files) {
    const res = {file: file.name, id: uid(), errors: [], warnings: [], rows: [], mapped: [], unknown: [], missing: []};
    try {
      const sheets = await readFileRows(file);
      let found = null;
      for (const s of sheets) {
        for (let i = 0; i < Math.min(15, s.rows.length); i++) {
          const map = (s.rows[i] || []).map(matchHeader);
          if (map.includes('date') && map.includes('site')) { found = {sheet: s.sheet, hdrIdx: i, header: s.rows[i], map, data: s.rows.slice(i + 1)}; break; }
        }
        if (found) break;
      }
      if (!found) throw new Error('No header row with "Date" and "Site" columns was found in the first 15 rows of any sheet. Download the template to check the expected format.');
      res.sheet = found.sheet;
      res.mapped = found.map.filter(Boolean);
      res.unknown = found.header.filter((h, j) => h != null && String(h).trim() !== '' && !found.map[j]).map(String);
      res.missing = FIELDS.filter(f => !res.mapped.includes(f.key)).map(f => f.label);
      const dupes = new Set(found.map.filter((k, j) => k && found.map.indexOf(k) !== j));
      if (dupes.size) res.warnings.push(`Duplicate columns for ${[...dupes].map(k => FIELD[k].label).join(', ')}. The first occurrence is used.`);
      const seen = new Map();
      found.data.forEach((row, i) => {
        if (!row || row.every(v => v == null || String(v).trim() === '')) return;
        const line = found.hdrIdx + i + 2; const rec = {}; const errs = [], warns = [];
        found.map.forEach((k, j) => {
          if (!k || (found.map.indexOf(k) !== j)) return;
          const v = row[j]; if (v == null || String(v).trim() === '') return;
          const f = FIELD[k];
          if (f.type === 'date') { const d = parseDate(v); if (!d) errs.push(`Date "${v}" not recognised`); else rec.date = d; }
          else if (f.type === 'num') { const n = parseNum(v); if (n == null) errs.push(`${f.label}: "${v}" is not a number`); else if (n < 0) errs.push(`${f.label} cannot be negative`); else rec[k] = n; }
          else if (f.type === 'ws') { const w = normWS(v); if (!w) errs.push(`Workstream "${v}" unknown (use ${WS.join(', ')})`); else rec.workstream = w; }
          else rec[k] = String(v).trim();
        });
        if (!rec.date && !errs.some(e => e.startsWith('Date'))) errs.push('Date is missing');
        if (!rec.site) errs.push('Site is missing');
        if (rec.site) {
          const c = siteCfgCI(rec.site);
          if (c) { rec.site = c.site; if (!rec.workstream) rec.workstream = c.workstream; else if (c.workstream !== rec.workstream) warns.push(`"${c.site}" is set up under ${c.workstream}; this row says ${rec.workstream}`); }
          else if (!rec.workstream) errs.push(`New site "${rec.site}" needs a Workstream`);
          else warns.push(`New site "${rec.site}" will be added to Sites & targets`);
        }
        if (isNum(rec.recovered) && isNum(rec.metres) && rec.recovered > rec.metres + 1e-9) warns.push('Core recovered exceeds metres drilled');
        if (rec.date && rec.date > todayStr()) warns.push('Date is in the future');
        if (!NUM_KEYS.some(k => isNum(rec[k])) && !rec.challenge && !rec.geology && !rec.action) warns.push('Row has no metrics or notes');
        const dk = `${rec.date}|${norm(rec.site)}|${norm(rec.holeId)}`;
        if (rec.date && rec.site) { if (seen.has(dk)) warns.push(`Same Date + Site + Hole as line ${seen.get(dk)}`); else seen.set(dk, line); }
        if (!rec.source) rec.source = 'Upload: ' + file.name;
        res.rows.push({line, rec, errs, warns});
      });

}

function guessDrill(rec) { const t = `${rec.drillType || ''} ${rec.activity || ''} ${rec.site}`.toLowerCase(); if (/\bdd\b|diamond/.test(t)) return 'DD'; if (/\brc\b|reverse|wrd/.test(t)) return 'RC'; return isNum(rec.metres) ? 'RC' : ''; }
async function commitImport(id) {
  const p = UI.pending.find(x => x.id === id); if (!p) return;
  const valid = p.rows.filter(r => !r.errs.length).map(r => r.rec);
  const replace = $('#opt-replace') ? $('#opt-replace').checked : true;
  if (DB.isSample && DB.records.some(r => r.id.startsWith('seed-'))) {
    const keep = !(await confirmBox('Keep the sample data?', 'You are importing your first real file. Remove the sample data (rebuilt from the attached reports) first? Choose "Remove sample data" for a clean start, or Cancel to keep it alongside your upload.', 'Remove sample data', true));
    if (!keep) { DB.records = DB.records.filter(r => !r.id.startsWith('seed-')); }
    DB.isSample = false;
  }
  let replaced = 0;
  if (replace) {
    const keys = new Set(valid.map(r => r.date + '|' + r.site));
    const before = DB.records.length;
    DB.records = DB.records.filter(r => !keys.has(r.date + '|' + r.site));
    replaced = before - DB.records.length;
  }
  for (const r of valid) {
    if (!siteCfg(r.site)) DB.sites.push({site: r.site, workstream: r.workstream, licence: '', activity: r.activity || '', drillType: r.workstream === 'Brownfield' ? guessDrill(r) : '', active: true});

    const rec = {...r, id: uid()}; delete rec.drillType;

  UI.pending = UI.pending.filter(x => x.id !== id);
  await persist();
  const last = valid.map(r => r.date).sort().pop();
  if (last) { UI.period.daily = last; UI.period.weekly = weekStartOf(last); UI.period.monthly = last.slice(0, 7); }
  render();
  toast(`Imported ${valid.length} row${valid.length > 1 ? 's' : ''}${replaced ? ` (${replaced} replaced)` : ''}. Weekly & monthly views updated.`);
}

const TEMPLATE_HEAD = FIELDS.map(f => f.label);
function recToRow(r) { return FIELDS.map(f => f.key === 'drillType' ? (siteCfg(r.site) || {}).drillType || '' : r[f.key] ?? ''); }
const csvCell = v => { const s = String(v ?? ''); return /[",\n\r;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
const toCSV = rows => '﻿' + rows.map(r => r.map(csvCell).join(',')).join('\r\n');
function templateRows() {
  const ex = (SEED ? SEED.records : []).filter(r => r.date === '2026-11-17').map(r => recToRow({...r, source: ''}));
  return [TEMPLATE_HEAD, ...ex];
}
function rollups(type) {
  const out = [['Period', 'Start', 'End', 'Site', 'Workstream', 'Metres', 'Core recovered (m)', 'Recovery %', 'Soil', 'Termite', 'Received', 'Submitted', 'Pending (latest)', 'Trips', 'Tonnes', 'Downtime (h)', 'Records']];
  const groups = new Map();
  for (const r of DB.records) { const k = periodKey(type, r.date) + '|' + r.site; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(r); }
  for (const [k, rs] of [...groups.entries()].sort()) {
    const [pk, site] = k.split('|'); const [a, b] = periodBounds(type, pk);
    const dd = rs.filter(r => isNum(r.recovered) && isNum(r.metres)); const mm = sum(dd, ['metres']);
    const pend = rs.filter(r => isNum(r.pending)).sort((x, y) => x.date.localeCompare(y.date)).pop();
    out.push([periodLabel(type, pk), a, b, site, rs[0].workstream, sum(rs, ['metres']) || '', sum(rs, ['recovered']) || '', mm ? Math.round(sum(dd, ['recovered']) / mm * 1000) / 10 : '',
      sum(rs, ['soil']) || '', sum(rs, ['termite']) || '', sum(rs, ['received']) || '', sum(rs, ['submitted']) || '', pend ? pend.pending : '', sum(rs, ['trips']) || '', sum(rs, ['waste', 'cu', 'co']) || '', sum(rs, ['downtime']) || '', rs.length]);
  }
  return out;
}

  else if (a === 'goto-sync') { UI.view = 'data'; render(); const c = $('#sync-card'); if (c) c.scrollIntoView({behavior: 'smooth', block: 'start'}); }
  else if (a === 'sync-save') {
    const v = id => ($(id) ? $(id).value.trim() : '');
    Object.assign(Sync.cfg, {owner: v('#sy-owner'), repo: v('#sy-repo').replace(/\.git$/, ''), branch: v('#sy-branch') || 'main', path: v('#sy-path') || 'data.json', token: v('#sy-token'), auto: $('#sy-auto').checked});
    Sync.saveCfg();
    if (!Sync.canPublish()) { toast('Fill in owner, repository and token.'); renderSyncCard(); return; }
    t.disabled = true; t.textContent = 'Testing…';
    try {
      await Sync.test(); Sync.meta.lastError = ''; Sync.saveMeta();
      toast(`Connected to ${Sync.cfg.owner}/${Sync.cfg.repo} ✓`);
      const remote = await Sync.getRemote();
      if (remote.data && versionOf(remote.data) > (Sync.meta.version || '') && !Sync.meta.dirty) await adoptShared(remote.data);
      else if (Sync.meta.dirty || !remote.data) {
        if (await confirmBox('Publish now?', remote.data ? 'Share the data on this computer with everyone now? It replaces the shared copy on GitHub.' : `There is no shared data in ${Sync.cfg.owner}/${Sync.cfg.repo} yet. Publish the ${NF0.format(DB.records.length)} records on this computer so everyone can see them?`, 'Publish', false)) await Sync.publish();
      }
    } catch (err) { Sync.meta.lastError = err.message; Sync.saveMeta(); toast('Connection failed: ' + err.message); }
    syncUI(); if (UI.view === 'data') renderSyncCard();
  }
  else if (a === 'sync-publish') { await Sync.publish(); }
  else if (a === 'sync-forget') {
    if (await confirmBox('Remove token?', 'This computer will no longer publish to GitHub. Shared data stays online.', 'Remove token')) { Sync.cfg.token = ''; Sync.saveCfg(); syncUI(); renderSyncCard(); }
  }
  else if (a === 'sync-load') {
    let d = null;
    try { d = Sync.canPublish() ? (await Sync.getRemote()).data : await Sync.fetchShared(); } catch (err) { d = await Sync.fetchShared(); }
    if (!d) { toast(Sync.hosted ? 'No shared data found on GitHub yet.' : 'Open the hosted GitHub Pages address to load shared data.'); return; }
    if (Sync.meta.dirty && !(await confirmBox('Replace this computer\'s data?', 'This computer has changes that are not shared. Loading the shared data replaces them.', 'Load shared data'))) return;
    await adoptShared(d); toast(`Loaded shared data (${NF0.format(DB.records.length)} records, updated ${fmtStamp(versionOf(d))}).`);
  }
  else if (a === 'dismiss-banner') { DB.settings.sampleBannerDismissed = true; await persist(false); renderSampleBanner(); }
  else if (a === 'del-rec') {
    const r = DB.records.find(x => x.id === t.dataset.id); if (!r) return;
    if (await confirmBox('Delete record?', `${r.site} · ${fmtD(r.date)}${r.holeId ? ' · ' + r.holeId : ''}. Weekly and monthly totals will be recalculated.`, 'Delete')) deleteRecords([r.id]);
  } else if (a === 'tbl-del-sel') {
    const st = UI.tables[t.dataset.tbl]; const ids = [...st.sel];
    if (await confirmBox(`Delete ${ids.length} records?`, 'This cannot be undone (export a backup first if unsure).', 'Delete')) { st.sel.clear(); deleteRecords(ids); }
  } else if (a === 'tbl-page') { const st = UI.tables[t.dataset.tbl]; st.page += +t.dataset.step; rerenderTable(t.dataset.tbl); }
  else if (a === 'imp-discard') { UI.pending = UI.pending.filter(x => x.id !== t.dataset.id); renderPendingImports(); }
  else if (a === 'imp-commit') { t.disabled = true; await commitImport(t.dataset.id); }
  else if (a === 'tpl-csv') download('Daily_Exploration_Template.csv', toCSV(templateRows()), 'text/csv;charset=utf-8');
  else if (a === 'tpl-xlsx') exportXLSX('Daily_Exploration_Template.xlsx', [['Daily data', templateRows(), FIELDS.map(f => Math.max(12, Math.min(40, f.label.length + 4)))],
    ['Column guide', [['Column', 'Required', 'Type', 'Description'], ...FIELDS.map(f => [f.label, f.req ? 'Yes' : '', f.type === 'num' ? 'number' : f.type, f.desc]),
      [], ['Workstreams', WS.join(', ')], ['Sites already set up', DB.sites.map(s => s.site).join(', ')]], [24, 10, 10, 80]]]);
  else if (a === 'export-json') download(`exploration-dashboard-backup-${stamp()}.json`, JSON.stringify({...Sync.payload(), exportedAt: new Date().toISOString()}, null, 1), 'application/json');
  else if (a === 'export-csv') download(`exploration-records-${stamp()}.csv`, toCSV([TEMPLATE_HEAD, ...DB.records.map(recToRow)]), 'text/csv;charset=utf-8');
  else if (a === 'export-xlsx') exportXLSX(`exploration-data-${stamp()}.xlsx`, [['Daily records', [TEMPLATE_HEAD, ...DB.records.map(recToRow)]], ['Weekly roll-up', rollups('week')], ['Monthly roll-up', rollups('month')],
    ['Sites & targets', [SITE_FIELDS.map(f => f.l + (f.g === 'O' ? ' (carried-in)' : '')), ...DB.sites.map(s => SITE_FIELDS.map(f => s[f.k] ?? ''))]]]);
  else if (a === 'import-json') $('#backup-input').click();
  else if (a === 'reset-clear') {
    if (await confirmBox('Clear all data?', 'All records, sites and targets will be removed' + (Sync.canPublish() && Sync.cfg.auto ? ', including the shared online copy that everyone sees' : ' from this browser') + '. Export a backup first if you may need them.', 'Clear everything')) {
      DB = {sites: [], records: [], settings: {weekStart: DB.settings.weekStart, sampleBannerDismissed: true}, log: [{when: new Date().toISOString(), action: 'reset', detail: 'All data cleared'}], isSample: false};
      UI.period = {daily: null, weekly: null, monthly: null}; UI.tables = {}; await persist(); render(); toast('All data cleared.');
    }
  } else if (a === 'reset-sample') {
    if (await confirmBox('Reload sample data?', 'This replaces all current records, sites and targets with the sample dataset from the attached reports.', 'Replace with sample')) {
      DB = seedDB(); UI.period = {daily: null, weekly: null, monthly: null}; UI.tables = {}; await persist(); render(); toast('Sample data reloaded.');
    }
  } else if (a === 'site-add') {
    DB.sites.push({site: 'New site ' + (DB.sites.length + 1), workstream: 'Brownfield', licence: '', activity: '', drillType: '', active: true});
    await persist(); renderSitesEditor();
  } else if (a === 'site-del') {
    const s = DB.sites[+t.dataset.i]; const n = DB.records.filter(r => r.site === s.site).length;
    if (await confirmBox(`Delete site "${s.site}"?`, n ? `Its ${n} record(s) will also be deleted.` : 'This site has no records.', 'Delete')) {
      DB.sites.splice(+t.dataset.i, 1); DB.records = DB.records.filter(r => r.site !== s.site); await persist(); render();
    }
  }
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.id === 'f-period') { UI.period[UI.view] = t.value; render(); }
  else if (t.id === 'f-ws') { UI.ws = t.value; render(); }
  else if (t.id === 'f-site') { UI.site = t.value; render(); }
  else if (t.id === 'f-from') { UI.from = t.value; if (UI.to && UI.from > UI.to) UI.to = UI.from; render(); }
  else if (t.id === 'f-to') { UI.to = t.value; if (UI.from && UI.to < UI.from) UI.from = UI.to; render(); }
  else if (t.id === 'f-metric') { UI.metric = t.value; render(); }
  else if (t.id === 'set-weekstart') { DB.settings.weekStart = +t.value; UI.period.weekly = null; await persist(); toast('Week start updated.'); }
  else if (t.id === 'file-input') { await handleFiles([...t.files]); t.value = ''; }
  else if (t.id === 'backup-input') {
    const f = t.files[0]; t.value = ''; if (!f) return;
    try {
      const d = JSON.parse(await f.text());
      if (!d || !Array.isArray(d.records) || !Array.isArray(d.sites)) throw new Error('Not a dashboard backup file (missing records/sites).');
      const bad = d.records.filter(r => !r || typeof r.date !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(r.date) || !r.site);
      if (bad.length) throw new Error(`${bad.length} record(s) have an invalid date or site.`);
      if (await confirmBox('Restore backup?', `Replace current data with ${d.records.length} records and ${d.sites.length} sites from "${f.name}"?`, 'Restore', false)) {
        DB = normalizeDB(d); DB.settings.sampleBannerDismissed = true;
        DB.log.unshift({when: new Date().toISOString(), action: 'restore', detail: `Restored from ${f.name}`});
        UI.period = {daily: null, weekly: null, monthly: null}; UI.tables = {}; await persist(); render(); toast('Backup restored.');
      }
    } catch (err) { toast('Restore failed: ' + err.message); }
  } else if (t.dataset.tblSel) { const st = UI.tables[t.dataset.tblSel]; t.checked ? st.sel.add(t.dataset.id) : st.sel.delete(t.dataset.id); rerenderTable(t.dataset.tblSel); }
  else if (t.dataset.tblSelall) {
    const id = t.dataset.tblSelall; const st = UI.tables[id];
    $$(`[data-tbl-sel="${id}"]`).forEach(c => t.checked ? st.sel.add(c.dataset.id) : st.sel.delete(c.dataset.id)); rerenderTable(id);
  } else if (t.dataset.tblSize) { const st = UI.tables[t.dataset.tblSize]; st.size = +t.value; st.page = 0; rerenderTable(t.dataset.tblSize); }
  else if (t.dataset.site !== undefined && t.dataset.f) {
    const s = DB.sites[+t.dataset.site]; const f = SITE_FIELDS.find(x => x.k === t.dataset.f);
    if (f.k === 'site') {
      const nv = t.value.trim();
      if (!nv || DB.sites.some((x, i) => i !== +t.dataset.site && norm(x.site) === norm(nv))) { toast('Site names must be unique and not empty.'); t.value = s.site; return; }
      DB.records.forEach(r => { if (r.site === s.site) r.site = nv; }); s.site = nv;
    } else if (f.k === 'workstream') { s.workstream = t.value; DB.records.forEach(r => { if (r.site === s.site) r.workstream = t.value; }); }
    else if (f.t === 'bool') s[f.k] = t.checked;
    else if (f.t === 'num') s[f.k] = t.value === '' ? null : Math.max(0, +t.value);
    else s[f.k] = t.value;
    await persist(); toast('Saved.');
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.tblSearch) {
    const id = t.dataset.tblSearch; const st = UI.tables[id]; st.q = t.value; st.page = 0;
    clearTimeout(t._d); t._d = setTimeout(() => { rerenderTable(id); const n = $(`[data-tbl-search="${id}"]`); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }, 200);
  }
});
document.addEventListener('click', e => {
  const th = e.target.closest('[data-tbl-sort]'); if (!th) return;
  const st = UI.tables[th.dataset.tblSort]; const k = th.dataset.k;
  if (st.sort === k) st.dir *= -1; else { st.sort = k; st.dir = ['date'].includes(k) || TABLE_COLS.find(c => c.k === k).n ? -1 : 1; }
  rerenderTable(th.dataset.tblSort);
});
$('#btn-theme').addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('xd-theme', next); } catch (e) {}
  $('#btn-theme span').textContent = next === 'dark' ? 'Light' : 'Dark';
  render();
});
$('#btn-print').addEventListener('click', () => window.print());
// Print: light palette, all table rows, charts re-drawn at print size
window.addEventListener('beforeprint', () => {
  UI.printing = true; UI._theme = document.documentElement.getAttribute('data-theme');
  document.documentElement.setAttribute('data-theme', 'light'); if (UI.view !== 'data') render();
  Object.values(charts).forEach(c => c.resize());
});
window.addEventListener('afterprint', () => {
  UI.printing = false; document.documentElement.setAttribute('data-theme', UI._theme || 'light'); render();
});
let _rt; window.addEventListener('resize', () => { clearTimeout(_rt); _rt = setTimeout(() => Object.values(charts).forEach(c => c.resize()), 150); });

/* ---------- boot ---------- */
(async function boot() {
  $('#btn-theme span').textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? 'Light' : 'Dark';
  const missing = [!window.Chart && 'Chart.js (charts)', !window.XLSX && 'SheetJS (Excel import/export)'].filter(Boolean);
  if (missing.length) $('#lib-warning').innerHTML = `<div class="banner warn">⚠ Could not load ${missing.join(' and ')} from the CDN. Check your internet connection. CSV upload and the tables still work.</div>`;
  let hadMeta = false; try { hadMeta = !!localStorage.getItem('xd-sync-meta'); } catch (e) {}
  Sync.load();
  const saved = await Store.load();
  if (saved && Array.isArray(saved.records) && Array.isArray(saved.sites)) {
    DB = {settings: {weekStart: 6, sampleBannerDismissed: false}, log: [], isSample: false, ...saved};
    DB.settings = {weekStart: 6, sampleBannerDismissed: false, ...(saved.settings || {})};
    // Data uploaded with the earlier (local-only) version counts as not shared yet
    if (!hadMeta && DB.records.some(r => !String(r.id).startsWith('seed-'))) { Sync.meta.dirty = true; Sync.saveMeta(); }
  } else { DB = seedDB(); await persist(false); }
  // Load the shared copy (data.json next to this page) when it is newer than what this browser has
  const shared = await Sync.fetchShared();
  if (shared) {
    Sync.shared = true;
    const v = versionOf(shared);
    if (!Sync.meta.dirty && (!Sync.meta.version || v > Sync.meta.version)) await adoptShared(shared, {quiet: true});
    else if (Sync.meta.dirty && v > (Sync.meta.version || '')) Sync.conflict = true;
  }
  render();
  setInterval(() => { if (document.visibilityState === 'visible' && !Sync.publishing) Sync.check(); }, 180000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !Sync.publishing) Sync.check(); });
})();
</script>
